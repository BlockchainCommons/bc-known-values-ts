[package]
name = "known-values-validation"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# The reference's default feature: registry files from configured directories.
# Compared in a second build; the default build here pins the crate without it.
directory-loading = ["known-values/directory-loading"]

[dependencies]
known-values = { version = "=0.15.5", default-features = false }
bc-components = { version = "=0.31.1", default-features = false }
dcbor = "=0.25.2"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
hex = "0.4"
