[package]
name = "known-values-validation"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# No default features: `directory-loading` would read the runner's ~/.known-values (V3).
known-values = { version = "=0.15.5", default-features = false }
bc-components = { version = "0.31", default-features = false }
dcbor = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
